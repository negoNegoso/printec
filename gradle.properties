#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# jvmCommonMain/jvmCommonTest definem manualmente a hierarquia entre os alvos
# android e jvm (necessario pois o KMP nao compartilha isso por padrao),
# entao desabilitamos o template padrao para evitar o warning de conflito.
kotlin.mpp.applyDefaultHierarchyTemplate=false

#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true